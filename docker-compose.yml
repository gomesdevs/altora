services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5433 evita conflito com Postgres local (Homebrew) em :5432
      - "5433:5432"
    environment:
      POSTGRES_USER: altora
      POSTGRES_PASSWORD: altora
      POSTGRES_DB: altora
    volumes:
      - altora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altora -d altora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  altora_pg:
